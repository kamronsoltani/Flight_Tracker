<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Flight Tracker</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: #12151a;
    --fg: #eef2f6;
    --muted: #8b95a3;
    --line: #2a313c;
    --accent: #e07a2f;
    --ok: #3ecf8e;
    --warn: #d4a017;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    background:
      radial-gradient(800px 420px at 100% -10%, #243041 0%, transparent 55%),
      var(--bg);
    color: var(--fg);
    padding: 1.5rem;
  }
  main {
    max-width: 420px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 650;
    letter-spacing: 0.04em;
    margin: 0 0 0.35rem;
  }
  .status {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 1.4rem;
  }
  .status.on { color: var(--ok); }
  .status.warn { color: var(--warn); }
  section {
    border-top: 1px solid var(--line);
    padding: 1.15rem 0;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .lbl { font-size: 0.95rem; font-weight: 560; }
  .hint { color: var(--muted); font-size: 0.78rem; margin-top: 0.2rem; }
  .val { color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] {
    width: 100%;
    margin-top: 0.85rem;
    accent-color: var(--accent);
  }
  input[type=time] {
    width: 100%;
    background: #1a1f27;
    border: 1px solid var(--line);
    color: var(--fg);
    border-radius: 8px;
    padding: 0.65rem 0.7rem;
    font: inherit;
  }
  .times {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-top: 0.9rem;
  }
  .times label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }
  .btnrow {
    display: flex;
    gap: 0.6rem;
    margin-top: 0.9rem;
  }
  button {
    flex: 1;
    font: inherit;
    font-weight: 600;
    border: 1px solid var(--line);
    background: #1a1f27;
    color: var(--fg);
    border-radius: 8px;
    padding: 0.75rem;
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    border-color: transparent;
    color: #141414;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  .toggle {
    position: relative;
    width: 48px;
    height: 28px;
    flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle span {
    position: absolute;
    inset: 0;
    background: #2a313c;
    border-radius: 999px;
    transition: 0.15s;
  }
  .toggle span::before {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.15s;
  }
  .toggle input:checked + span { background: var(--accent); }
  .toggle input:checked + span::before { transform: translateX(20px); }
</style>
</head>
<body>
<main>
  <h1>FLIGHT TRACKER</h1>
  <div class="status warn" id="link">Connecting…</div>

  <section>
    <div class="row">
      <div>
        <div class="lbl">Panel power</div>
        <div class="hint">Turn the matrix on or off</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="power" checked/>
        <span></span>
      </label>
    </div>
    <div class="btnrow">
      <button class="primary" id="btnOn" type="button">On</button>
      <button id="btnOff" type="button">Off</button>
    </div>
  </section>

  <section>
    <div class="row">
      <div class="lbl">Brightness</div>
      <div class="val" id="briVal">180</div>
    </div>
    <input type="range" id="bri" min="0" max="255" value="180"/>
  </section>

  <section>
    <div class="row">
      <div>
        <div class="lbl">Schedule</div>
        <div class="hint">Auto on/off · Pacific time</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="sched"/>
        <span></span>
      </label>
    </div>
    <div class="times">
      <div>
        <label for="onTime">On</label>
        <input type="time" id="onTime" value="07:00"/>
      </div>
      <div>
        <label for="offTime">Off</label>
        <input type="time" id="offTime" value="23:00"/>
      </div>
    </div>
    <div class="btnrow">
      <button class="primary" id="saveSched" type="button">Save schedule</button>
    </div>
  </section>
</main>

<script>
const CFG = window.FT_CONFIG || {};
const $ = (s) => document.querySelector(s);
let client = null;
let briTimer = null;

function topic(suffix) {
  return `ft/${CFG.deviceId}/${suffix}`;
}

function setLink(text, cls) {
  const el = $('#link');
  el.textContent = text;
  el.className = 'status ' + (cls || '');
}

function sendCmd(obj) {
  if (!client || !client.connected) return;
  client.publish(topic('cmd'), JSON.stringify(obj), { qos: 1 });
}

function applyStatus(j) {
  if (j.on != null) $('#power').checked = !!j.on;
  if (j.brightness != null) {
    $('#bri').value = j.brightness;
    $('#briVal').textContent = j.brightness;
  }
  if (j.schedEnabled != null) $('#sched').checked = !!j.schedEnabled;
  if (j.onHour != null && j.onMin != null) {
    $('#onTime').value =
      String(j.onHour).padStart(2, '0') + ':' + String(j.onMin).padStart(2, '0');
  }
  if (j.offHour != null && j.offMin != null) {
    $('#offTime').value =
      String(j.offHour).padStart(2, '0') + ':' + String(j.offMin).padStart(2, '0');
  }
}

function saveSchedule() {
  const [oh, om] = $('#onTime').value.split(':').map(Number);
  const [fh, fm] = $('#offTime').value.split(':').map(Number);
  sendCmd({
    schedEnabled: $('#sched').checked,
    onHour: oh, onMin: om,
    offHour: fh, offMin: fm
  });
}

function connectMqtt() {
  if (!CFG.brokerUrl || String(CFG.brokerUrl).includes('YOUR_CLUSTER')) {
    setLink('Edit config.js with HiveMQ settings', 'warn');
    return;
  }
  client = mqtt.connect(CFG.brokerUrl, {
    username: CFG.username,
    password: CFG.password,
    clientId: 'dash-' + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 2000,
    clean: true
  });
  client.on('connect', () => {
    setLink('Connected — waiting for panel…', 'warn');
    client.subscribe(topic('status'));
    client.subscribe(topic('online'));
  });
  client.on('reconnect', () => setLink('Reconnecting…', 'warn'));
  client.on('close', () => setLink('Disconnected', 'warn'));
  client.on('message', (t, buf) => {
    const msg = buf.toString();
    if (t.endsWith('/online')) {
      setLink(msg === '1' ? 'Panel online' : 'Panel offline', msg === '1' ? 'on' : 'warn');
      return;
    }
    if (t.endsWith('/status')) {
      try { applyStatus(JSON.parse(msg)); } catch (e) {}
    }
  });
}

$('#bri').addEventListener('input', (e) => {
  $('#briVal').textContent = e.target.value;
  clearTimeout(briTimer);
  briTimer = setTimeout(() => sendCmd({ brightness: +e.target.value }), 200);
});
$('#bri').addEventListener('change', (e) => {
  clearTimeout(briTimer);
  sendCmd({ brightness: +e.target.value });
});
$('#power').addEventListener('change', (e) => {
  sendCmd({ on: e.target.checked, schedEnabled: false });
});
$('#btnOn').onclick = () => {
  $('#power').checked = true;
  sendCmd({ on: true, schedEnabled: false });
};
$('#btnOff').onclick = () => {
  $('#power').checked = false;
  sendCmd({ on: false, schedEnabled: false });
};
$('#saveSched').onclick = saveSchedule;
$('#sched').onchange = saveSchedule;

connectMqtt();
</script>
</body>
</html>
